<title>HazMat</title>
<style>
 :root{
  --bg:#0e0f11; --panel:#15171a; --line:#262a2f; --ink:#e9ecef; --dim:#9aa0a6; --acc:#ffb020; --ok:#69db7c;

 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
 header{display:flex;gap:1rem;align-items:baseline;padding:1rem 1.4rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
 header b{color:var(--acc);letter-spacing:.06em}

 main{max-width:62rem;margin:0 auto;padding:1.4rem}

 button{cursor:pointer} button:hover{border-color:var(--acc)}

 .row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
 .note{color:var(--dim);max-width:44rem}
 table{border-collapse:collapse;width:100%} th,td{border-bottom:1px solid var(--line);padding:.45rem .4rem;text-align:left;vertical-align:top}

 code{color:#7fd1ff;word-break:break-all} a.card,tr.clickable{cursor:pointer}
 .chip{display:inline-block;padding:.05rem .4rem;border:1px solid;border-radius:999px;font-size:.78rem;white-space:nowrap}
 .card{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:.8rem;margin:.6rem 0}
 .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.6rem}
 .big{font-size:1.5rem}
 .warn{border-color:#5c4b1a;background:#1b1710}
 iframe{width:100%;height:34rem;border:1px solid var(--line);background:#111;border-radius:4px}
 footer{color:var(--dim);padding:2rem 1.4rem;border-top:1px solid var(--line);font-size:.85rem}
 .sp{color:var(--dim)} .err{color:var(--c1)} .small{font-size:.85rem}
img.mark{width:32px;height:32px;background:#e8e8e8;border-radius:4px;padding:2px;image-rendering:pixelated}
.lede img.mark{width:64px;height:64px;border-radius:6px;padding:4px;vertical-align:middle;margin-right:.6rem}
 .prose{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.62}
 .lede{border-bottom:2px solid var(--line);padding-bottom:1rem;margin-bottom:1.2rem}
 .kicker{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
 .lede h1{font-size:1.7rem;line-height:1.25;margin:.35rem 0 .5rem;letter-spacing:-.01em}
 .lede-p{font-size:1.05rem;margin:.5rem 0}
 .facts{display:flex;flex-wrap:wrap;gap:.35rem .8rem;margin:.7rem 0 0}
 .badge{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:.05rem .5rem;font-size:.72rem;color:var(--dim);white-space:nowrap}
 .badge.good{border-color:var(--ok);color:var(--ok)}
 .banner{border-left:3px solid var(--acc)}
 ul.summary{padding-left:1.1rem;max-width:46rem} ul.summary li{margin:.35rem 0}
 .haz{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:.9rem 1rem;margin:.8rem 0}
 .haz-title{font-weight:600;margin:.4rem 0}
 .haz p{margin:.45rem 0;max-width:48rem}
 details{margin:.6rem 0} summary{cursor:pointer}
 details table{margin-top:.5rem}
.qa{border-left:2px solid var(--line);padding:.1rem 0 .3rem .8rem;margin:1rem 0}
.qa h3{margin:.1rem 0 .3rem;font-size:1rem}
.qa p{margin:.2rem 0}
</style>

  const main=document.getElementById('main');
  main.innerHTML=`<h1>scan a contract</h1>
   <p class="note">Paste an address (or raw 0x bytecode). You get matched placards, what was actually read, and a sheet you can hand to someone.</p>
   <form class="row" id="f">
     <input id="t" size="44" placeholder="0x address or 0x bytecode" value="${esc(address||'')}">
     <select id="c">${['mainnet','base','arbitrum','optimism','sepolia'].map(x=>`<option${x===chain?' selected':''}>${x}</option>`).join('')}</select>
     <button class="primary">scan</button>
   </form>
   <p class="note" id="examples">try: <a href="#/scan/mainnet/0xc2292af8b51109a27a4b4e28e9cf9f3aede4190c">the escrow HZ-001 was found on</a></p>
   <div id="out"></div>`;
  document.getElementById('f').onsubmit=e=>{e.preventDefault();location.hash=`#/scan/${document.getElementById('c').value}/${document.getElementById('t').value.trim()}`};
  if(!address) return;
  const out=document.getElementById('out'); out.innerHTML='<p class="note">reading chain…</p>';
  let d; try{ d=await get(`/scan?chain=${encodeURIComponent(chain)}&target=${encodeURIComponent(address)}`); }
  catch(e){ out.innerHTML=`<div class="card warn"><b class="err">blocked</b><div class="note">${esc(e.message)}</div></div>`; return }
  const cov=d.coverage||{}, ms=d.matches||[], sub=d.subject||{}, P=d.presentation||{};
  const idents=Object.entries(sub.identity||{}).map(([a,v])=>`${esc(a.slice(0,10))} ${esc(v.name||v.state||'')}`).join(' · ');
  const subjectCard = sub.kind? `<p class="sp small prose">${esc(sub.kind)} <code>${esc(sub.requested)}</code>
    ${sub.via?` · resolved via ${esc(sub.via)}`:''}
    ${sub.effective&&sub.effective!==sub.requested?` · logic at <code>${esc(sub.effective)}</code>`:''}
    ${idents?` · ${idents}`:''}</p>` : '';
  const sheetHref=window.SHEET_HREF||`/sheet?chain=${encodeURIComponent(chain)}&target=${encodeURIComponent(address)}`;
  out.innerHTML=`
   <article class="lede">
     <div class="kicker">hazmat · safety data sheet</div>
     <h1>${esc(d.target)}</h1>
     <p class="lede-p prose">${esc(P.standfirst||'')}</p>
     <div class="facts">${(P.badges||[]).map(b=>`<span class="badge">${esc(b)}</span>`).join('')}</div>
     ${subjectCard}
     <div class="row" style="margin-top:.7rem">
       <a class="card" href="${sheetHref}" target="_blank">open sheet</a>
       <a class="card" href="/pdf?chain=${encodeURIComponent(chain)}&target=${encodeURIComponent(address)}">pdf</a>
       <span class="card" id="perm">permalink</span>
     </div>
   </article>
   <div class="card banner"><b>Assertion level: ${esc(d.assertion||'')}.</b> A match is a candidate, not a clearance:
    this fingerprints a contract against registered hazard shapes, it does not audit it.
    A clean sheet is not the same as safe.</div>
   <h2>summary</h2>
   <ul class="summary prose">${(P.summary||[]).map(b=>`<li>${b.label?`<b>${esc(b.label)}:</b> `:''}${esc(b.text)}</li>`).join('')}</ul>
   <h2>answers to the usual questions</h2>
   <p class="sp small prose">Read from the selectors this contract exposes, not from its docs. Every answer says what it cannot tell you.</p>
   ${(P.answers||[]).map(a=>`<div class="qa">
      <h3>${esc(a.question)}</h3><p class="prose">${esc(a.answer)}</p>
      <p class="sp small">seen: ${esc((a.evidence||[]).join(', ')||'no matching selector, so this is its shape')}</p>
      <p class="sp small">not answered here: ${esc(a.cannot)}</p>
      ${(a.related||[]).length?`<p class="sp small">related hazard: ${a.related.map(r=>`<a href="#/placard/${esc(r)}">${esc(r)}</a>`).join(' ')}</p>`:''}
     </div>`).join('')}
   <div class="card banner"><b>Bottom line:</b> <span class="prose">${esc(P.bottom_line||'')}</span></div>
   <h2>before you trust it, check</h2>
   <ul class="prose">${(P.checklist||[]).map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
   <h2>hazards found</h2>
   ${(P.hazards||[]).map(h=>`<div class="haz" style="border-left:3px solid var(--c${h.class})">
      <div class="row"><a href="#/placard/${esc(h.id)}"><b>${esc(h.id)}</b></a>${chip(h.class)}
        ${h.badges.map(b=>`<span class="badge${b==='confirmed on this target'?' good':''}">${esc(b)}</span>`).join('')}</div>
      <div class="haz-title">${esc(h.title)}</div>
      ${h.summary?`<p class="prose">${esc(h.summary)}</p>`:''}
      ${h.money?`<p class="prose"><b>What is at stake:</b> ${esc(h.money.replace(/\.$/,''))}.</p>`:''}
      ${h.fix?`<p class="prose"><b>What to do:</b> ${esc(h.fix)}</p>`:''}
      ${h.evidence?`<p class="sp small">${esc(h.evidence)}</p>`:''}
      ${h.precedent?`<p class="sp prose small">${esc(h.precedent)}</p>`:''}
      <p class="sp small">matched by <code>${esc((h.matched_by||[]).join(' '))}</code></p>
     </div>`).join('') || `<div class="card"><p class="prose">None of the registered hazards are present.
      That is not the same as safe: the register is shaped after a handful of projects, so this contract may
      simply be unfamiliar to it.</p></div>`}
   <h2>what was read</h2>
   <p class="prose">${esc(P.coverage_means||cov.means||'')}</p>
   <div class="grid">
     <div class="card"><div class="big">${cov.selectors_in_code}</div><div class="sp">selectors in code</div></div>
     <div class="card"><div class="big">${cov.selectors_the_register_asks_about}</div><div class="sp">the register asks about</div></div>
     <div class="card"><div class="big">${cov.selectors_otherwise_unaccounted}</div><div class="sp">unaccounted</div></div>
     <div class="card"><div class="big">${esc((d.register_anchor||{}).epoch||'-')}</div><div class="sp">anchor epoch</div></div>
   </div>
   <p class="sp small prose">${esc(P.coverage_note||'')}</p>
   <details><summary>unaccounted selectors &mdash; the nearest misses (${(cov.unaccounted_sample||[]).length}). These are in the code and no registered hazard asks about them.</summary>
   <table>${(cov.unaccounted_sample||[]).map(u=>`<tr><td><code>${esc(u.selector)}</code></td><td class="sp">${esc(u.signature||'unnamed')}</td></tr>`).join('')}</table></details>
   <h2>not checked at all</h2>
   <ul class="prose">${(P.not_checked||d.not_checked||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
   <h2>the technical part</h2>
   <p class="sp small">${esc(P.pins||'')}</p>
   <table>${(P.technical||[]).map(t=>`<tr><td class="sp">${esc(t.label)}</td><td><code>${esc(t.value)}</code></td></tr>`).join('')}</table>
   <h2>the sheet as a document</h2><iframe src="${sheetHref}" title="sheet"></iframe>`;
  document.getElementById('perm').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(location.href);document.getElementById('perm').textContent='copied'};
}

async function registerView(){
  const r=await get('/api/register'); const main=document.getElementById('main');
  main.innerHTML=`<h1>the register</h1>
   <p class="note">Append-only, cited like a CVE. <b>pattern</b> is a bytecode match and only a candidate; <b>confirmed</b> came with a reproduction that ran and a rebuilt runtime whose selector set matches the deployed code.</p>
   <table><tr><th>id</th><th>class</th><th>hazard</th><th>tier</th><th>money</th></tr>
   ${r.placards.map(p=>`<tr class="clickable" onclick="location.hash='#/placard/${esc(p.id)}'">
     <td><b>${esc(p.id)}</b></td><td>${chip(p.placard_class)}</td><td>${esc(p.title)}</td>
     <td class="sp">${esc(p.tier)}</td><td class="sp">${esc(p.money)}</td></tr>`).join('')}</table>
   <p class="note">${r.count} placards · epoch ${esc((r.anchor||{}).epoch||'none')} ${esc((r.anchor||{}).root||'')}</p>`;
}

async function placardView(id){
  const p=await get('/api/placard/'+encodeURIComponent(id)); const main=document.getElementById('main');
  const c=p.confirmation||{};
  main.innerHTML=`<h1>${esc(p.id)} ${chip(p.placard_class)}</h1>
   <div class="card">${esc(p.title)}<div class="note">${esc(p.summary)}</div></div>
   <h2>matcher</h2><div class="card"><code>${esc((p.matcher.require_all||[]).join(' '))}</code>
    ${(p.matcher.require_none_of||[]).length?`<div class="sp">absent check over ${p.matcher.require_none_of.length} signatures</div>`:''}
    <div class="note">${esc(p.matcher.notes||'')}</div></div>
   <h2>money</h2><div class="card">${esc((p.money_bound||{}).expression||'n/a')}</div>
   <h2>reproduction</h2><div class="card"><code>${esc((p.reproduction||{}).command||'')}</code>
     <div class="sp">${esc((p.reproduction||{}).expected||'')}</div></div>
   ${c.verdict?`<h2>confirmation</h2><div class="card"><b>${esc(c.verdict)}</b>
     <div class="sp">${esc(c.evidence||'')}</div><div class="sp">${esc(c.selector_agreement||'')}</div>
     <div class="sp">record <code>${esc(c.record||'')}</code></div></div>`:''}
   <h2>provenance</h2><div class="card"><div class="sp">${esc((p.provenance||{}).specimen||'')}</div>
     <div class="sp">${esc((p.provenance||{}).published_source||'')}</div>
     <ul class="note">${((p.provenance||{}).evidence||[]).map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>
   <h2>anchor</h2><div id="proof" class="card">checking…</div>`;
  try{ const pr=await get('/api/proof?placard='+encodeURIComponent(id));
    document.getElementById('proof').innerHTML=`epoch ${esc(pr.epoch)} · leaf <code>${esc(pr.leaf)}</code>
     <div class="sp">${pr.proof.length} proof steps · root <code>${esc(pr.root)}</code></div>
     <div class="sp">${pr.verified?'proof verifies against the published root':'PROOF DOES NOT VERIFY'}</div>`;
  }catch(e){ document.getElementById('proof').textContent=e.message }
}

async function anchorsView(){
  const a=await get('/api/anchors'); const main=document.getElementById('main');
  main.innerHTML=`<h1>anchors</h1>
   <p class="note">One merkle root per epoch. Leaf = keccak256 of a placard's canonical json; pairs are sorted before hashing so a proof needs no side flags; an odd level sorts and then duplicates its last node. <code>anchors/HazMatAnchor.sol</code> implements the same fold on-chain and a forge test checks it against this prover.</p>
   ${a.epochs.map(e=>`<div class="card"><b>epoch ${esc(e.epoch)}</b> <span class="sp">${esc(e.placards)} placards · register v${esc(e.register_digest)}</span>
     <div><code>${esc(e.root)}</code></div></div>`).join('')||'<p class="note">no epoch published yet</p>'}
   <h2>prove a placard</h2><div class="card"><input id="pl" placeholder="HZ-001" size="12">
    <div id="proofout" class="sp"></div></div>`;
  document.getElementById('pl').oninput=async e=>{
    const el=document.getElementById('proofout'); const id=e.target.value.trim().toUpperCase(); if(!id) return el.textContent='';
    try{ const p=await get('/api/proof?placard='+id);
      el.innerHTML=`leaf <code>${esc(p.leaf)}</code> · ${p.proof.length} steps · root <code>${esc(p.root)}</code> · ${p.verified?'<span style="color:var(--ok)">verifies</span>':'<span class="err">fails</span>'}`;
    }catch(err){ el.textContent=err.message }
  };
}

function aboutView(){
  document.getElementById('main').innerHTML=`<h1>what this is, and what it is not</h1>
   <div class="card"><b>two tiers.</b> <b>pattern</b> is a bytecode match: cheap, no source needed, and only a candidate. <b>confirmed</b> means the placard ships a reproduction that ran, and the source was rebuilt with the record's own compiler settings to a selector set identical to the deployed runtime.</div>
   <div class="card"><b>nothing claims safety.</b> A match means the selectors a placard asks about are present. It does not mean the hazard is reachable, and a clean sheet mostly means unfamiliar.</div>
   <div class="card"><b>what a sheet always states.</b> Bytes read, selectors extracted, how many the register asked about, which ones nothing accounts for, the register's digest and anchor epoch. Evidence of what was read, not just what matched.</div>
   <div class="card"><b>read-only.</b> No wallet, no signature, no broadcast. Code is read from a public RPC; sheets are self-contained and carry their own digest, re-derivable with <code>hazmat verify</code>.</div>
   <div class="card"><b>the corpus is small.</b> Ten placards shaped after a handful of projects. Breadth, not machinery, is the limit.</div>`;
}

function route(){
  const h=location.hash.replace(/^#/,'')||'/'; const parts=h.split('/').filter(Boolean);
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#/'+parts[0]||(!parts.length&&a.getAttribute('href')==='#/')));
  if(!parts.length) return scanView('mainnet','');
  if(parts[0]==='scan') return scanView(parts[1]||'mainnet', parts[2]||'');
  if(parts[0]==='register') return registerView();
  if(parts[0]==='placard') return placardView(parts[1]);
  if(parts[0]==='anchors') return anchorsView();
  if(parts[0]==='about') return aboutView();
  return scanView('mainnet','');
}

async function boot(){
  try{ const r=await fetch('/api/register').then(r=>r.json());
    document.getElementById('anchorTag').textContent = r.anchor? 'epoch '+r.anchor.epoch : 'no epoch';
    document.getElementById('regline').textContent = ' register '+r.count+' placards v'+(r.digest||'');
  }catch(e){}
  route();
}
addEventListener('hashchange',route); boot();
</script>
</html>
